version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: user_platform_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: user_platform_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: user_platform_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_URL: http://localhost:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: user_platform_db
      DB_SYNCHRONIZE: 'false'
      DB_SSL: 'false'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - avatar_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: user_platform_frontend
    restart: always
    ports:
      - '80:80'
      - '4200:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  avatar_uploads:
